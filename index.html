<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Single Line - Một nét chỉ</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #183b37;
        touch-action: none;
      }
      #game-container {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      #game-container canvas {
        display: block;
        margin: 0 !important; /* Prevents Phaser from adding duplicate margin offsets */
      }
      @media (min-width: 769px) {
        #game-container canvas {
          border-radius: 28px;
          box-shadow: 0 0 0 3px #0f2a27, 0 18px 40px rgba(6, 22, 20, 0.55);
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
